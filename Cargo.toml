[package]
name = "agtk"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
base64 = "0.22"
futures-channel = "0.3"
gio = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
libc = "0.2"
nix = { version = "0.31.3", features = ["fs", "poll", "process", "signal", "socket", "term", "uio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.2"
vte = { package = "vte4", version = "0.10.0", features = ["gtk_v4_18", "v0_84"] }
regex = "1"
memchr = "2"
webkit6 = "=0.6.1"

[dependencies.adw]
package = "libadwaita"
version = "0.9.2"
features = ["gtk_v4_22", "v1_9"]

[dev-dependencies]
tempfile = "3.23"

[build-dependencies]
glib-build-tools = "=0.22.8"

# The installed agtk is a debug build, so a change rebuilds in seconds.
# Dependencies compile once, so they are optimized: agtk's log scanning and
# screen parsing lean on regex, memchr and serde_json. Overflow wraps as in a
# release build, because a panic in agtk-session closes that agent's terminal.
[profile.dev]
debug = "line-tables-only"
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3
