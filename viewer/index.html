<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>agtk diff</title>
  </head>
  <body>
    <main id="viewer" aria-label="Read-only file viewer">
      <header id="diff-heading" aria-live="polite">
        <strong id="file-name">No file selected</strong>
        <span id="version-labels"></span>
        <span id="metadata"></span>
      </header>
      <div id="editor" aria-label="File comparison"></div>
      <div id="file-editor" aria-label="File contents"></div>
      <div id="markdown" tabindex="-1" aria-label="Rendered Markdown">
        <article id="markdown-body"></article>
      </div>
      <section id="image-view" aria-label="Image viewer" hidden>
        <div id="image-toolbar" role="group" aria-label="Image size">
          <button id="image-fit" type="button" aria-pressed="true">Fit to window</button>
          <button id="image-actual" type="button" aria-pressed="false">Actual size (100%)</button>
          <span id="image-status" role="status"></span>
        </div>
        <div id="image-viewport" tabindex="0" aria-label="Image preview"></div>
      </section>
      <p id="empty-state">Select a file to view it.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
